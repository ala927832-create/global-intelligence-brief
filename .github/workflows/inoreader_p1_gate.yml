# P1 only: proves actual private Inoreader exported feeds, no publication.
# PR: isolated credential-free tests. Main push: automatic private feed probe.
name: GIB P1 - Live Inoreader source gate (no publication)
on:
  pull_request:
    paths:
      - 'tools/gib_style_c_rc/inoreader_source.py'
      - 'qa/inoreader_p1_probe.py'
      - 'tests/test_inoreader_p1_probe.py'
      - '.github/workflows/inoreader_p1_gate.yml'
  push:
    branches: [main]
    paths:
      - 'tools/gib_style_c_rc/inoreader_source.py'
      - 'qa/inoreader_p1_probe.py'
      - 'tests/test_inoreader_p1_probe.py'
      - '.github/workflows/inoreader_p1_gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-p1:
    name: P1 contract and safe normalization (no private values)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only required source adapter dependency
        run: python -m pip install 'requests>=2.32,<3'
      - name: Offline P1 acceptance regression suite
        run: |
          python -m unittest discover -s tests -p 'test_inoreader_source.py' -v
          python -m unittest discover -s tests -p 'test_inoreader_p1_probe.py' -v
  actual-four-feeds:
    name: P1 REAL GitHub Secrets → Inoreader → original news (HOLD)
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate-p1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
      INOREADER_GLOBAL_FEED_URL: ${{ secrets.INOREADER_GLOBAL_FEED_URL }}
      INOREADER_MACRO_FEED_URL: ${{ secrets.INOREADER_MACRO_FEED_URL }}
      INOREADER_ENERGY_COMMODITIES_FEED_URL: ${{ secrets.INOREADER_ENERGY_COMMODITIES_FEED_URL }}
      INOREADER_TAIWAN_FEED_URL: ${{ secrets.INOREADER_TAIWAN_FEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required HTTPS feed dependency
        run: python -m pip install 'requests>=2.32,<3'
      - name: Prove four actual Inoreader output feeds with no secret disclosure
        run: python qa/inoreader_p1_probe.py
      - name: Upload safe source gate report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gib-inoreader-p1-safe-gate-${{ github.run_id }}
          path: qa_out/inoreader_p1_live_gate.json
          retention-days: 14
# This does not generate, publish, schedule or approve GIB issues. No private export URLs in artifacts.
