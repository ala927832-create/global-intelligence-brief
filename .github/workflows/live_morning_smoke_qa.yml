name: GIB one-time live morning source + EPUB QA (no publication)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live_morning_smoke_qa.yml'
      - 'tests/test_editorial_rebuild.py'
      - 'gib/collect.py'
      - 'gib/newsroom_v16.py'
      - 'gib/editorial.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FREENEWS_API_KEY: ${{ secrets.FREENEWS_API_KEY }}
      GEMINI_FREE_TIER_CONFIRMED: '0'
      ENABLE_GEMINI: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install public QA dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y pandoc fonts-noto-cjk
      - name: Verify frozen specifications before touching sources
        run: python -m unittest discover -s tests -q
      - name: Collect live news, produce audited morning Essential and Deep EPUB
        run: python run_newsroom_v16.py --edition morning --verify-official | tee qa_run.json
      - name: Verify the live Essential and Deep books are self-contained offline
        run: |
          python - <<'PY'
          import json
          from scripts.check_offline_package import inspect
          record=json.load(open("qa_run.json",encoding="utf-8"))
          checked=[inspect(record["epub"][kind]["epub"]) for kind in ("essential","deep")]
          for row in checked:
              print(row)
          if any(x["issues"] for x in checked):
              raise SystemExit("OFFLINE_LINK_OR_RESOURCE_VALIDATION_FAILED")
          PY
      - name: Validate generated files with official EPUBCheck
        run: |
          output=$(python -c 'import json,pathlib;print(pathlib.Path(json.load(open("qa_run.json"))["issue_json"]).parent)')
          bash scripts/run_epubcheck_qa.sh "$output"
      - name: Show QA news headlines and release blockers
        if: always()
        run: |
          if [ -s qa_run.json ]; then
            python scripts/qa_actions_summary.py
          else
            echo '## QA stopped before issue.json generation' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve QA artifacts even if sources or EPUB fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gib-one-time-live-morning-qa-${{ github.run_number }}
          path: |
            qa_outputs/
            qa_run.json
          retention-days: 14
# Does not use Gemini, LINE, Github Pages, payment, or production delivery.
