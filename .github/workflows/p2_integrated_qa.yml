# Approved GIB P2 integrated QA only: no cron, public Pages, LINE or production.
name: GIB P2 - integrated global newsroom morning-evening QA (HOLD)
on:
  pull_request:
    paths:
      - 'run_newsroom_v16.py'
      - 'qa/p2_integrated_batch.py'
      - 'qa/r2_evidence_preflight.py'
      - 'tests/test_r2_evidence_preflight.py'
      - 'qa/r2_build_packets.py'
      - 'gib/r2_evidence_packets.py'
      - 'tests/test_r2_evidence_packets.py'
      - 'tests/test_r2_primary_links.py'
      - 'config/r2_primary_research_links_20261029.json'
      - 'qa/p2_content_gate.py'
      - 'tests/test_p2_v3_content_gate.py'
      - 'config/frozen_contract.json'
      - 'gib/contract.py'
      - 'qa/p2_source_fusion.py'
      - 'tests/test_p2_source_fusion.py'
      - 'qa/opml_free_p1.py'
      - 'gib/newsroom_v16.py'
      - 'gib/publish_v16.py'
      - 'tests/test_v2_source_bound_reader.py'
      - 'tests/test_v2_browser_content_qa.py'
      - 'docs/qa-web-v2/**'
      - 'tests/test_p2_integrated_batch.py'
      - 'tests/test_p2_editorial_evidence_gate.py'
      - 'tests/test_editorial_depth_standard.py'
      - 'tests/test_editorial_evidence_depth.py'
      - 'gib/p2_editorial_acceptance.py'
      - 'gib/editorial.py'
      - 'gib/gemini_editor_v16.py'
      - 'tools/gib_style_c_rc/test_bridge.py'
      - 'tools/gib_style_c_rc/live_html_qa.py'
      - 'AGENTS.md'
      - 'EDITORIAL_V16_IMPLEMENTATION.md'
      - '.github/workflows/p2_integrated_qa.yml'
  push:
    branches: [main]
    paths:
      - 'run_newsroom_v16.py'
      - 'qa/p2_integrated_batch.py'
      - 'qa/r2_evidence_preflight.py'
      - 'tests/test_r2_evidence_preflight.py'
      - 'qa/r2_build_packets.py'
      - 'gib/r2_evidence_packets.py'
      - 'tests/test_r2_evidence_packets.py'
      - 'tests/test_r2_primary_links.py'
      - 'config/r2_primary_research_links_20261029.json'
      - 'qa/p2_content_gate.py'
      - 'tests/test_p2_v3_content_gate.py'
      - 'config/frozen_contract.json'
      - 'gib/contract.py'
      - 'qa/p2_source_fusion.py'
      - 'tests/test_p2_source_fusion.py'
      - 'qa/opml_free_p1.py'
      - 'gib/newsroom_v16.py'
      - 'gib/publish_v16.py'
      - 'tests/test_v2_source_bound_reader.py'
      - 'tests/test_v2_browser_content_qa.py'
      - 'docs/qa-web-v2/**'
      - 'tests/test_p2_integrated_batch.py'
      - 'tests/test_p2_editorial_evidence_gate.py'
      - 'tests/test_editorial_depth_standard.py'
      - 'tests/test_editorial_evidence_depth.py'
      - 'gib/p2_editorial_acceptance.py'
      - 'gib/editorial.py'
      - 'gib/gemini_editor_v16.py'
      - 'tools/gib_style_c_rc/test_bridge.py'
      - 'tools/gib_style_c_rc/live_html_qa.py'
      - '.github/workflows/p2_integrated_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-integration:
    name: P2 full canonical morning-evening Style C plus Essential Deep fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENABLE_GEMINI: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing dependencies and original EPUB preview tool
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y pandoc fonts-noto-cjk
      - name: Owner charter, existing modules and paired P2 integration regression
        run: |
          python -m unittest discover -s tests -q
          python -m py_compile qa/p2_integrated_batch.py run_newsroom_v16.py tools/gib_style_c_rc/live_html_qa.py gib/p2_editorial_acceptance.py
          python tools/gib_style_c_rc/test_bridge.py
  real-paired-qa:
    name: P2 real 24-feed snapshot, one editorial pipeline, 2 QA editions (no publication)
    needs: offline-integration
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Already part of the owner-approved original free source stack.
      FREENEWS_API_KEY: ${{ secrets.FREENEWS_API_KEY }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || '0' }}
      # P2 QA free-only compatibility: 2.5 Flash-Lite returned HTTP 404 for this project.
      # P2-only model, not a change to existing user GEMINI_MODEL variable or production.
      GEMINI_MODEL: ${{ vars.GIB_P2_QA_MODEL || 'gemini-3.5-flash-lite' }}
      ENABLE_GEMINI: ${{ vars.GEMINI_FREE_TIER_CONFIRMED == '1' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install source and Style C plus dual-reading toolset
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y pandoc fonts-noto-cjk
      - name: G0/G1 evidence-bearing source count before any Gemini or reader preview
        # Integrated runner fails closed and returns diagnostics, not a preview, on low data.
        # It will only call Gemini and produce reader files after both hard gates pass.
        run: |
          echo 'Source-first gate enforced in qa/p2_integrated_batch.py'
      - name: Produce real-source paired internal QA with free-only Gemini when permitted
        run: |
          python qa/p2_integrated_batch.py --gemini | tee qa_p2_summary.json
      - name: Audit all generated read-only editions for missing EPUB files and source hashes
        run: |
          python - <<'PY'
          import glob,json,pathlib
          from scripts.check_offline_package import inspect
          blocked=sorted(glob.glob('qa_outputs/p2_integrated/*/P2_V3_CONTENT_HOLD.json'))
          if blocked:
              assert len(blocked)==1, 'Only one blocked batch expected'
              hold=json.loads(pathlib.Path(blocked[0]).read_text(encoding='utf-8'))
              assert hold['gate']=='HOLD_NO_READER_PREVIEW'
              assert not hold['gemini_called'] and not hold['nonpublished_preview_generated']
              assert not hold['editions'] and not hold['p2_content_accepted']
              print('P2_V3_HARD_GATE_HOLD: no HTML/EPUB generated or handed to owner; diagnostic only.')
              raise SystemExit(0)
          paths=sorted(glob.glob('qa_outputs/p2_integrated/*/P2_INTEGRATED_QA_REPORT.json'))
          assert len(paths)==1, 'No single integrated P2 QA report'
          report=json.loads(pathlib.Path(paths[0]).read_text(encoding='utf-8'))
          assert report['source_configured']==24
          assert report['p2_original_opml_source_gate']==report['source_gate']
          assert report['p2_source_index_total'] >= report['p2_source_index_opml_count']
          assert set(report['p2_existing_free_sources'])=={'freenews','gdelt','official_rss'}
          assert not report['release_approved']
          assert not report['p2_content_accepted']
          assert set(report['editions'])=={'morning','evening'}
          for edition,row in report['editions'].items():
              source=pathlib.Path(row['issue_json'])
              assert source.is_file()
              assert row['issue_sha256']
              assert pathlib.Path(row['style_c_html']).is_file()
              for name in ('essential_epub','deep_epub'):
                  checks=inspect(row[name])
                  if checks['issues']:
                      raise AssertionError(f'{edition} {name} offline QA failed: {checks["issues"]}')
              assert row['release_approved'] is False
          print('P2_TECHNICAL_ARTIFACTS_AND_OFFLINE_QA_PASS; EDITORIAL_AND_RELEASE_HOLD')
          PY
      - name: R2 source-evidence and editorial-depth test ONLY after G0/G1 structural thresholds
        # No new provider calls, Gemini, text generation or reader files.
        # Reads exactly the live source index already produced by the prior step.
        run: |
          python - <<'PY'
          import glob,subprocess,sys,pathlib,json
          paths=sorted(glob.glob('qa_outputs/p2_integrated/*/source_index.json'))
          assert len(paths)==1, 'R2 requires exactly one independently acquired source index'
          source=pathlib.Path(paths[0])
          report=source.parent/'R2_G2_EVIDENCE_PREFLIGHT.json'
          subprocess.run([sys.executable,'qa/r2_evidence_preflight.py',
                          '--source-index',str(source),
                          '--output',str(report)],check=True)
          record=json.loads(report.read_text(encoding='utf-8'))
          assert not record['gemini_called'] and not record['generated_html']
          assert not record['generated_epub'] and not record['release_approved']
          if record['r2']['started']:
              assert record['r1']['source_and_selection_structural_ready']
          print('R2_REAL_SOURCE_DIAGNOSTIC_ONLY_NO_CONTENT_RELEASE',
                record['r2']['status'])
          PY
      - name: R2 evidence-first four analysis packets and two current-topic research candidates
        # From the SAME source-index.json, with only bounded approved official
        # source pages. This step NEVER creates draft articles, Gemini calls,
        # HTML, EPUB, owner preview or release approval.
        run: |
          python - <<'PY'
          import glob,json,pathlib,subprocess,sys
          paths=glob.glob('qa_outputs/p2_integrated/*/source_index.json')
          assert len(paths)==1, 'R2 requires one real harvested source index'
          source=pathlib.Path(paths[0])
          report=source.parent/'R2_EVIDENCE_PACKETS.json'
          subprocess.run([sys.executable,'qa/r2_build_packets.py',
                          '--source-index',str(source),
                          '--output',str(report),
                          '--max-documents','6'],check=True)
          record=json.loads(report.read_text(encoding='utf-8'))
          assert not record['gemini_first_pass_allowed']
          assert not record['gemini_second_pass_allowed']
          assert not record['gemini_called']
          assert not record['generated_reader_files']
          assert not record['release_approved']
          print('R2_RESEARCH_PACKET_HOLD',record['status'],
                'analysis candidates=',len(record['analysis_packets']),
                'current deep topic candidates=',len(record['current_deep_research_shortlist']),
                'primary matched=',record.get('focus_with_located_primary_context',0),
                'issuer documents matched=',record.get('curated_primary_documents_located',0),
                'claim phrases located=',record.get('curated_primary_claim_phrases_matched',0))
          PY
      - name: Upload one consolidated P2 QA bundle (including blockers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gib-p2-integrated-qa-${{ github.run_id }}
          path: |
            qa_outputs/
            qa_p2_summary.json
          retention-days: 14
          if-no-files-found: warn
# Never schedule publication or require the owner to repeatedly trigger QA.
