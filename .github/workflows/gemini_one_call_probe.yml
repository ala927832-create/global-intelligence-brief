name: GIB single Gemini 3.5 free-tier API probe (one call; no publishing)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini_one_call_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || '0' }}
      ENABLE_ONE_CALL_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Probe 3.5 Flash-Lite once, never fallback to paid model
        run: python scripts/gemini_free_preflight.py
# No schedule, publication, repeat, billing changes, or full articles.
