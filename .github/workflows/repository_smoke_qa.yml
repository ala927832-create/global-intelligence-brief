name: GIB repository smoke QA (no publication)
on:
  push:
    branches: [main]
    paths:
      - 'gib/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/repository_smoke_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Install EPUB layout tool used by tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc fonts-noto-cjk
      - name: Run frozen-contract and newsroom regression suite
        run: python -m unittest discover -s tests -q
      - name: Check README and core paths are deployed
        run: |
          test -s config/frozen_contract.json
          test -s config/sources.json
          test -s gib/newsroom_v16.py
          test -s gib/gemini_editor_v16.py
          test -s gib/publish_v16.py
          test -s .github/workflows/manual_editorial_qa.yml
          test -s .github/workflows/ten_day_live_qa.yml
          echo 'REPOSITORY_CORE_FILES_PRESENT'
# Safe on push: no news fetch, model use, LINE, Pages or production schedule.
