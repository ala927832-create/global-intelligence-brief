name: GIB read-only Gemini free model catalog (no inference)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini_model_catalog_readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read metadata for eligible research models, generate nothing
        run: python scripts/gemini_model_catalog_readonly.py
